[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-house-hunting"
version = "0.1.0"
description = "Local, personalized house-hunting web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.29",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
smart-house-hunting = "smart_house_hunting.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
